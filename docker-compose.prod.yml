# ============================================================
# Production Docker Compose — Enterprise RAG Assistant
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# Runs the event-driven ingestion pipeline from ARCHITECTURE.md §1.2:
#   api -> MinIO (S3) + Kafka -> worker -> ChromaDB
# Scale ingestion independently of query traffic:
#   docker-compose -f docker-compose.prod.yml up -d --scale worker=3
# ============================================================

x-ingestion-env: &ingestion-env
  ASYNC_INGESTION: "true"
  STORAGE_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET:-enterprise-rag-documents}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  EVENT_BUS: kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-3}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - checkpoint_data:/app/checkpoints
      - ./data:/app/data:ro
    env_file: .env
    environment:
      <<: *ingestion-env
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-domain.com}
      AUTH_ENABLED: "true"
      DEBUG_MODE: "false"
      LOG_LEVEL: WARNING
      JSON_LOGS: "true"
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Indexing runs here, not on the request path. Scale with --scale worker=N;
  # Kafka splits the partitions across the consumer group.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: python -m scripts.worker
    volumes:
      - chroma_data:/app/chroma_db
      - checkpoint_data:/app/checkpoints
    env_file: .env
    environment:
      <<: *ingestion-env
      DEBUG_MODE: "false"
      LOG_LEVEL: INFO
      JSON_LOGS: "true"
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Give an in-flight document time to finish before SIGKILL; the worker
    # stops claiming new events as soon as it sees SIGTERM.
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  ui:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --server.enableCORS false
    ports:
      - "${UI_PORT:-8501}:8501"
    # Least privilege: the UI only proxies to the API — it must not receive
    # the full .env (OPENAI_API_KEY etc.). It needs the API URL and one API
    # key to authenticate against the API when AUTH_ENABLED=true.
    environment:
      - API_URL=http://api:8000
      - RAG_API_KEY=${RAG_UI_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # S3-compatible object storage. Swap for real S3 by dropping this service
  # and pointing S3_ENDPOINT_URL at AWS (or leaving it blank).
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the bucket once, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-enterprise-rag-documents} &&
      echo 'bucket ready'
      "

  # KRaft mode — no ZooKeeper.
  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single broker in this compose file; raise both for a real cluster.
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

volumes:
  chroma_data:
    driver: local
  checkpoint_data:
    driver: local
  minio_data:
    driver: local
  kafka_data:
    driver: local
