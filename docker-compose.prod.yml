# ============================================================
# Production Docker Compose — Enterprise RAG Assistant
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# Runs the event-driven ingestion pipeline from ARCHITECTURE.md §1.2:
#   api -> MinIO (S3) + Kafka -> worker -> ChromaDB
# Scale ingestion independently of query traffic:
#   docker-compose -f docker-compose.prod.yml up -d --scale worker=3
# ============================================================

x-ingestion-env: &ingestion-env
  ASYNC_INGESTION: "true"
  STORAGE_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET:-enterprise-rag-documents}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  EVENT_BUS: kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-3}
  # Mandatory here: the API and the worker are separate containers, and
  # embedded ChromaDB cannot see another process's writes — the API would
  # never serve a document the worker indexed.
  CHROMA_MODE: server
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  # Shared rate limit counters and semantic cache. Without this each API
  # replica keeps its own counters, so N replicas allow N x the limit.
  RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
  REDIS_URL: redis://redis:6379/1

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # No chroma volume: vectors live in the chroma service.
      - checkpoint_data:/app/checkpoints
      - ./data:/app/data:ro
    env_file: .env
    environment:
      <<: *ingestion-env
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-domain.com}
      AUTH_ENABLED: "true"
      DEBUG_MODE: "false"
      LOG_LEVEL: WARNING
      JSON_LOGS: "true"
    depends_on:
      chroma:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Indexing runs here, not on the request path. Scale with --scale worker=N;
  # Kafka splits the partitions across the consumer group.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: python -m scripts.worker
    volumes:
      - checkpoint_data:/app/checkpoints
    env_file: .env
    environment:
      <<: *ingestion-env
      DEBUG_MODE: "false"
      LOG_LEVEL: INFO
      JSON_LOGS: "true"
    depends_on:
      chroma:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Give an in-flight document time to finish before SIGKILL; the worker
    # stops claiming new events as soon as it sees SIGTERM.
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  ui:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --server.enableCORS false
    ports:
      - "${UI_PORT:-8501}:8501"
    # Least privilege: the UI only proxies to the API — it must not receive
    # the full .env (OPENAI_API_KEY etc.). It needs the API URL and one API
    # key to authenticate against the API when AUTH_ENABLED=true.
    environment:
      - API_URL=http://api:8000
      - RAG_API_KEY=${RAG_UI_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Single source of truth for vectors. Both the API and the workers read
  # and write through it, which is what makes a document indexed by a
  # worker immediately queryable by the API.
  chroma:
    image: chromadb/chroma:1.5.9
    # No published port. Only api and worker talk to Chroma, and they do so
    # over the compose network as `chroma:8000`.
    #
    # This matters more than usual: chromadb 1.x carries an unfixed
    # pre-authentication code-injection advisory (PYSEC-2026-311). Reaching
    # the port is the precondition for exploiting it, so the port must not
    # leave the internal network. For local inspection use a tunnel:
    #   docker compose -f docker-compose.prod.yml exec chroma sh
    expose:
      - "8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped
    healthcheck:
      # Must be bash, not sh: the image ships dash as /bin/sh and /dev/tcp
      # is a bash builtin. With sh this probe can never pass, so api and
      # worker would wait on service_healthy forever. There is no curl or
      # wget in the image.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Shared state for anything that must be consistent across API replicas:
  # rate limit counters today, the semantic cache when REDIS_URL is set.
  # Deliberately not a hard dependency — if Redis is down the API keeps
  # serving with per-process counters rather than returning errors.
  redis:
    image: redis:7.4-alpine
    # Internal only. An exposed Redis with no password is one of the most
    # reliably exploited services on the internet.
    expose:
      - "6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # S3-compatible object storage. Swap for real S3 by dropping this service
  # and pointing S3_ENDPOINT_URL at AWS (or leaving it blank).
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    # Loopback only: reachable through an SSH tunnel for operators, not
    # from the network. The bucket holds every uploaded document.
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the bucket once, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-enterprise-rag-documents} &&
      echo 'bucket ready'
      "

  # KRaft mode — no ZooKeeper. Uses the official Apache image; Bitnami's
  # Kafka tags were withdrawn from Docker Hub and no longer pull.
  kafka:
    image: apache/kafka:3.8.0
    # Internal only — api and worker reach the broker as `kafka:9092`.
    # An exposed broker with AUTO_CREATE_TOPICS enabled lets anyone who can
    # reach it publish forged ingestion events.
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single broker in this compose file; raise all three for a real cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

volumes:
  chroma_data:
    driver: local
  checkpoint_data:
    driver: local
  minio_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local
