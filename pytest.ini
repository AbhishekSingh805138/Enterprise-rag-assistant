[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Integration tests need real Kafka/MinIO/Chroma containers, so they are
# excluded by default and the everyday suite stays hermetic and fast.
# Run them with:  docker compose -f docker-compose.test.yml up -d && pytest -m integration
addopts = -v --tb=short -m "not integration"
markers =
    integration: requires the containers in docker-compose.test.yml
filterwarnings =
    ignore::DeprecationWarning:langchain_community
