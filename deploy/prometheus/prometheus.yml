# Minimal scrape config for the Enterprise RAG Assistant.
#
#   docker run -p 9090:9090 \
#     -v "$PWD/deploy/prometheus:/etc/prometheus" \
#     prom/prometheus:v2.55.1
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    # /metrics reports queue depths, document counts and per-department
    # totals, so it requires a key for the same reason /health?deep=true
    # does. Use a key scoped to no departments — the exporter needs none.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/rag_api_key
    static_configs:
      - targets: ["api:8000"]

# alertmanager wiring is deployment-specific; point it at yours:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]
