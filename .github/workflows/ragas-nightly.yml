# Nightly RAG quality regression gate.
#
# Separate from ci.yml on purpose. This job spends real tokens and its
# scores are non-deterministic, so running it on pull requests would
# produce flaky failures that people learn to re-run until green — which
# is worse than having no gate, because it also teaches the team to
# ignore it. On a schedule, against a fixed corpus, a failure means
# something.
name: RAGAS Nightly

on:
  schedule:
    # 02:30 UTC — after the working day in most timezones, so a
    # regression is waiting when someone arrives rather than landing
    # mid-deploy.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Record this run as the new baseline instead of gating"
        type: boolean
        default: false

concurrency:
  group: ragas-nightly
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Without a key there is nothing to measure; skip rather than fail,
    # so a fork without secrets does not show a permanently red badge.
    if: github.repository_owner != ''

    services:
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8001:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Index the evaluation corpus
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHROMA_MODE: server
          CHROMA_HOST: localhost
          CHROMA_PORT: "8001"
          CHROMA_COLLECTION: ragas_nightly
        run: python -m scripts.ingest ./data/sample_docs

      - name: Run the quality gate
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHROMA_MODE: server
          CHROMA_HOST: localhost
          CHROMA_PORT: "8001"
          CHROMA_COLLECTION: ragas_nightly
          # The gate must measure the pipeline, not a cached answer.
          SEMANTIC_CACHE_ENABLED: "false"
          # ...and must not be truncated by the per-query cost ceiling,
          # or a budget change would look like a quality regression.
          COST_BUDGET_PER_QUERY: "0"
          LOG_LEVEL: WARNING
        run: |
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            python -m scripts.ragas_gate --mode graph --retriever hybrid --update-baseline
          else
            python -m scripts.ragas_gate --mode graph --retriever hybrid
          fi

      - name: Upload the updated baseline
        if: inputs.update_baseline == true
        uses: actions/upload-artifact@v4
        with:
          name: ragas-baseline
          path: src/eval/baseline.json

      - name: Report
        if: failure()
        run: |
          echo "::error::RAG quality regressed. Compare the prompt_set in the"
          echo "::error::gate output against the baseline — a prompt or"
          echo "::error::retrieval change is the usual cause."
