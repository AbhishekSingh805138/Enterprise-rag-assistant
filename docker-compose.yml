# ============================================================
# Development Docker Compose — Enterprise RAG Assistant
#
# Async ingestion is off by default here, so /upload stays synchronous
# and no extra services are needed. To exercise the event-driven pipeline
# locally without Kafka or MinIO, set ASYNC_INGESTION=true in .env and
# start the worker profile:
#   docker-compose --profile async up
# The api and worker containers share the object store and queue through
# the checkpoint/object volumes below.
# For the full Kafka + MinIO topology see docker-compose.prod.yml.
# ============================================================

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # chroma_db is only used in embedded mode (the default, sync ingestion).
      # Under --profile async the api talks to the chroma service instead.
      - ./chroma_db:/app/chroma_db
      - ./checkpoints:/app/checkpoints
      - ./object_store:/app/object_store
      - ./data:/app/data:ro
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    command: python -m scripts.worker
    profiles: ["async"]
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./object_store:/app/object_store
    env_file: .env
    environment:
      # The SQLite queue is a shared file, so both containers must agree
      # on its path — and it must live on the mounted volume.
      - ASYNC_INGESTION=true
      - EVENT_BUS=sqlite
      - EVENT_BUS_PATH=/app/checkpoints/event_bus.db
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_DIR=/app/object_store
      # Required whenever the worker is a separate process from the API.
      - CHROMA_MODE=server
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      api:
        condition: service_started
      chroma:
        condition: service_started
    stop_grace_period: 60s

  # Only needed for the async profile; embedded ChromaDB cannot be shared
  # between the API and the worker.
  chroma:
    image: chromadb/chroma:1.5.9
    profiles: ["async"]
    ports:
      - "8001:8000"
    volumes:
      - ./chroma_server:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      api:
        condition: service_started
    environment:
      - API_URL=http://api:8000
